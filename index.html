<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amanda</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4a0e2e, #7a1f4c);
      color: white;
      text-align: center;
      overflow: hidden;
    }
    h1 {
      font-size: 3rem;
      margin: 0;
      animation: pulsar 1.5s ease-in-out infinite;
    }
    .coracao {
      font-size: 4rem;
      margin-top: 1rem;
    }
    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <h1>Amanda, te amo ❤️</h1>
  <div class="coracao">💕</div>
</body>
</html>
